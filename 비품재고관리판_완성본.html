      <!-- 품목이 없을 때 표시 -->

        <!-- JS로 동적 카드 생성 -->

    const STORAGE_KEY = 'QUIOSK_INVENTORY_ITEMS_V1';

    // 앱 상태
    let inventory = [];
    let activeCategory = 'ALL';
    let searchQuery = '';
    let showUrgentOnly = false;

    // ----------------------------------------------------
    // 2. 초기화 및 LocalStorage 핸들링
    // ----------------------------------------------------
    function initApp() {
      loadInventory();
      renderCategoryChips();
      renderApp();
      startClock();
    }

    function loadInventory() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          inventory = JSON.parse(stored);
        } else {
          // 최초 실행 시 기본 데이터 탑재
          inventory = JSON.parse(JSON.stringify(INITIAL_INVENTORY_DATA));
          saveInventory();
        }
      } catch (err) {
        console.error('LocalStorage 로드 실패:', err);
        inventory = JSON.parse(JSON.stringify(INITIAL_INVENTORY_DATA));
      }
    }

    function saveInventory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
      } catch (err) {
        console.error('LocalStorage 저장 실패:', err);
      }
    }

    function resetToInitialData() {
      if (confirm('기본 비품 대장의 15개 초기 데이터로 재설정하시겠습니까?\n(현재 수정된 수량은 초기화됩니다)')) {
        inventory = JSON.parse(JSON.stringify(INITIAL_INVENTORY_DATA));
        saveInventory();
        showToast('초기 비품 대장 15종 데이터로 복원되었습니다.', 'info');
        renderApp();
      }
    }

    // ----------------------------------------------------
    // 3. 수량 차감 [-1] & 복구 [+1] 핵심 비즈니스 로직
    // ----------------------------------------------------
    function changeQuantity(itemId, delta) {
      const item = inventory.find(i => i.id === itemId);
      if (!item) return;

      if (delta < 0 && item.currentQty <= 0) {
        showToast(`[${item.name}] 재고가 이미 0입니다.`, 'warning');
        return;
      }

      item.currentQty = Math.max(0, item.currentQty + delta);
      saveInventory();
      renderApp();

      if (delta < 0) {
        showToast(`'${item.name}' 1${item.unit} 꺼냄 (잔여: ${item.currentQty}${item.unit})`, 'decrease');
      } else {
        showToast(`'${item.name}' 1${item.unit} 보정/추가 (잔여: ${item.currentQty}${item.unit})`, 'increase');
      }
    }

    // ----------------------------------------------------
    // 4. UI 렌더링 파이프라인
    // ----------------------------------------------------
    function renderApp() {
      updateSummaryAndBanner();
      renderCards();
    }

    // 상단 배너 및 통계 지표 갱신
    function updateSummaryAndBanner() {
      const totalCount = inventory.length;
      const urgentItems = inventory.filter(i => i.currentQty <= i.minQty);
      const urgentCount = urgentItems.length;
      const safeCount = totalCount - urgentCount;

      // 지표 갱신
      document.getElementById('statTotalItems').textContent = `${totalCount}개`;
      document.getElementById('statUrgentItems').textContent = `${urgentCount}개`;
      document.getElementById('statSafeItems').textContent = `${safeCount}개`;

      // 배너 갱신
      const banner = document.getElementById('urgentAlertBanner');
      const urgentCountBadge = document.getElementById('urgentCountBadge');
      const urgentSummaryText = document.getElementById('urgentSummaryText');

      if (urgentCount > 0) {
        banner.classList.remove('hidden');
        urgentCountBadge.textContent = `${urgentCount}건`;
        
        // 발주 필요 품목 이름 최대 3개 미리보기
        const previewNames = urgentItems.slice(0, 3).map(i => i.name).join(', ');
        const extraCount = urgentCount > 3 ? ` 외 ${urgentCount - 3}건` : '';
        urgentSummaryText.textContent = `발주 대상: ${previewNames}${extraCount} (최소 수량 이하 도달)`;
      } else {
        banner.classList.add('hidden');
      }

      // '발주 필요 품목만 모아보기' 버튼 텍스트/스타일
      const urgentBtnText = document.getElementById('urgentFilterBtnText');
      if (showUrgentOnly) {
        urgentBtnText.textContent = '전체 품목 보기';
      } else {
        urgentBtnText.textContent = '발주 필요 품목만 모아보기';
      }
    }

    // 카테고리 칩 렌더링
    function renderCategoryChips() {
      const categories = ['ALL', '용지', '현장소모품', '필기구', '사무소모품', '프린터', '탕비실', '공용', '현장안전'];
      const container = document.getElementById('categoryChips');
      container.innerHTML = '';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        const isActive = activeCategory === cat && !showUrgentOnly;
        btn.className = `px-3.5 py-1.5 rounded-xl font-bold transition-all shrink-0 cursor-pointer text-xs sm:text-sm ${
          isActive 
            ? 'bg-blue-600 text-white shadow-sm' 
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
        }`;
        btn.textContent = cat === 'ALL' ? '전체 품목' : cat;
        btn.onclick = () => {
          activeCategory = cat;
          showUrgentOnly = false;
          renderCategoryChips();
          renderApp();
        };
        container.appendChild(btn);
      });
    }

    // 카드 그리드 렌더링
    function renderCards() {
      const grid = document.getElementById('itemGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      // 필터링 적용
      let filtered = inventory.filter(item => {
        // 긴급 발주 필터
        if (showUrgentOnly && item.currentQty > item.minQty) {
          return false;
        }
        // 카테고리 필터
        if (!showUrgentOnly && activeCategory !== 'ALL' && item.category !== activeCategory) {
          return false;
        }
        // 검색어 필터
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchName = item.name.toLowerCase().includes(q);
          const matchLoc = item.location.toLowerCase().includes(q);
          const matchVendor = item.vendor.toLowerCase().includes(q);
          const matchCat = item.category.toLowerCase().includes(q);
          const matchNote = (item.note || '').toLowerCase().includes(q);
          if (!matchName && !matchLoc && !matchVendor && !matchCat && !matchNote) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(item => {
        const isUrgent = item.currentQty <= item.minQty;
        const card = document.createElement('div');
        
        // 발주 필요 시 붉은색 테두리 및 배경 반전 강조 (PRD 핵심 요구사항)
        card.className = `relative rounded-2xl p-5 sm:p-6 transition-all duration-200 flex flex-col justify-between ${
          isUrgent
            ? 'bg-rose-50/70 border-2 border-red-500 shadow-lg shadow-red-100 ring-1 ring-red-400'
            : 'bg-white border border-slate-200 shadow-sm hover:shadow-md'
        }`;

        card.innerHTML = `
          <!-- 카드 헤더 (뱃지 & 카테고리) -->
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold ${
                isUrgent ? 'bg-red-200 text-red-900' : 'bg-slate-100 text-slate-700'
              }">
                ${item.category}
              </span>
              ${
                isUrgent
                  ? `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-black bg-red-600 text-white shadow-sm animate-pulse">
                      🚨 발주 필요
                    </span>`
                  : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-md text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200">
                      여유
                    </span>`
              }
            </div>

            <!-- 품목명 -->
            <h3 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900 leading-snug break-keep">
              ${item.name}
            </h3>

            <!-- 비고 (있을 경우만 표시) -->
            ${
              item.note 
                ? `<p class="text-xs text-slate-500 mt-1 line-clamp-1" title="${item.note}">💡 ${item.note}</p>` 
                : `<p class="text-xs text-transparent select-none mt-1">-</p>`
            }

            <!-- 보관 위치 및 거래처 안내 (물품 못 찾는 일 방지) -->
            <div class="mt-4 pt-3 border-t border-dashed ${isUrgent ? 'border-red-200' : 'border-slate-200'} space-y-1.5 text-xs">
              <div class="flex items-center text-slate-700">
                <span class="font-bold w-16 text-slate-400 shrink-0">📍 보관위치</span>
                <span class="font-black ${isUrgent ? 'text-red-950 bg-red-100/80 px-2 py-0.5 rounded' : 'text-slate-800 bg-slate-100 px-2 py-0.5 rounded'}">
                  ${item.location}
                </span>
              </div>
              <div class="flex items-center text-slate-500">
                <span class="font-medium w-16 text-slate-400 shrink-0">🏢 주거래처</span>
                <span class="font-semibold text-slate-600">${item.vendor}</span>
              </div>
            </div>
          </div>

          <!-- 카드 중앙: 재고 수량 표시 영역 -->
          <div class="my-5 py-4 px-4 rounded-xl ${isUrgent ? 'bg-red-100/60 border border-red-200' : 'bg-slate-50 border border-slate-100'} flex items-baseline justify-between">
            <div>
              <span class="text-xs font-bold ${isUrgent ? 'text-red-600' : 'text-slate-500'}">현재 재고</span>
              <div class="flex items-baseline gap-1 mt-0.5">
                <span class="text-4xl sm:text-5xl font-black tracking-tight ${isUrgent ? 'text-red-600' : 'text-slate-900'} tabular-nums">
                  ${item.currentQty}
                </span>
                <span class="text-base font-bold ${isUrgent ? 'text-red-600' : 'text-slate-600'}">
                  ${item.unit}
                </span>
              </div>
            </div>
            <div class="text-right">
              <span class="text-xs font-semibold text-slate-400">최소 기준</span>
              <div class="text-sm font-black text-slate-600 mt-1 tabular-nums">
                ${item.minQty} ${item.unit}
              </div>
            </div>
          </div>

          <!-- 카드 하단: 원클릭 극단적 단순 조작 버튼 ([-1] 및 [+1]) -->
          <div class="grid grid-cols-4 gap-2 pt-1">
            <!-- 큼직한 [-1] 버튼 (3/4 영역 차지) -->
            <button 
              type="button"
              onclick="changeQuantity('${item.id}', -1)"
              ${item.currentQty <= 0 ? 'disabled' : ''}
              class="col-span-3 btn-press flex items-center justify-center gap-2 py-4 px-4 rounded-xl font-black text-lg sm:text-xl transition-all shadow-md cursor-pointer ${
                item.currentQty <= 0
                  ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'
                  : isUrgent
                    ? 'bg-red-600 hover:bg-red-700 text-white shadow-red-200 active:bg-red-800'
                    : 'bg-slate-900 hover:bg-slate-800 text-white shadow-slate-200 active:bg-black'
              }"
              title="물품 꺼내기 (1개 차감)"
            >
              <svg class="w-6 h-6 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
              </svg>
              <span>-1 ${item.unit} 꺼냄</span>
            </button>

            <!-- 실수 보정용 [+1] 버튼 (1/4 영역 차지) -->
            <button 
              type="button"
              onclick="changeQuantity('${item.id}', 1)"
              class="col-span-1 btn-press flex flex-col items-center justify-center py-3 px-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold border border-slate-300 transition-all cursor-pointer"
              title="실수로 눌렀을 때 복구 (+1)"
            >
              <svg class="w-5 h-5 stroke-[2.5] text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              <span class="text-[11px] font-semibold mt-0.5 text-slate-500">실수보정</span>
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ----------------------------------------------------
    // 5. 검색 및 필터 핸들러
    // ----------------------------------------------------
    function handleSearch(val) {
      searchQuery = val;
      const clearBtn = document.getElementById('btnClearSearch');
      if (val.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCards();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      searchQuery = '';
      document.getElementById('btnClearSearch').classList.add('hidden');
      renderCards();
    }

    function toggleUrgentFilter() {
      showUrgentOnly = !showUrgentOnly;
      renderCategoryChips();
      renderApp();
    }

    function resetFilters() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('btnClearSearch').classList.add('hidden');
      activeCategory = 'ALL';
      showUrgentOnly = false;
      renderCategoryChips();
      renderApp();
    }

    // ----------------------------------------------------
    // 6. CSV 대장 내보내기 (Excel 한글 깨짐 방지 UTF-8 BOM 적용)
    // ----------------------------------------------------
    function exportToCsv() {
      try {
        const headers = ["품목", "분류", "단위", "현재수량", "최소수량", "보관위치", "주 거래처", "마지막 주문일", "비고"];
        const rows = inventory.map(item => [
          `"${(item.name || '').replace(/"/g, '""')}"`,
          `"${(item.category || '').replace(/"/g, '""')}"`,
          `"${(item.unit || '').replace(/"/g, '""')}"`,
          item.currentQty,
          item.minQty,
          `"${(item.location || '').replace(/"/g, '""')}"`,
          `"${(item.vendor || '').replace(/"/g, '""')}"`,
          `"${(item.lastOrderDate || '').replace(/"/g, '""')}"`,
          `"${(item.note || '').replace(/"/g, '""')}"`
        ]);

        const csvContent = [
          headers.join(","),
          ...rows.map(row => row.join(","))
        ].join("\r\n");

        // UTF-8 BOM (\uFEFF) 추가하여 엑셀에서 바로 열어도 한글이 안 깨지도록 함
        const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const fileName = `비품대장_${year}-${month}-${day}.csv`;

        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast(`'${fileName}' 다운로드가 완료되었습니다.`, 'info');
      } catch (err) {
        console.error('CSV 생성 오류:', err);
        showToast('CSV 다운로드 중 오류가 발생했습니다.', 'warning');
      }
    }

    // ----------------------------------------------------
    // 7. 토스트 피드백 시스템
    // ----------------------------------------------------
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let bgClass = 'bg-slate-900 text-white';
      let icon = '🔔';
      if (type === 'decrease') {
        bgClass = 'bg-slate-900 text-white border-l-4 border-amber-500';
        icon = '📦';
      } else if (type === 'increase') {
        bgClass = 'bg-slate-900 text-white border-l-4 border-blue-500';
        icon = '↩️';
      } else if (type === 'warning') {
        bgClass = 'bg-rose-700 text-white';
        icon = '⚠️';
      } else if (type === 'info') {
        bgClass = 'bg-emerald-700 text-white';
        icon = '✅';
      }

      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-sm font-semibold transition-all transform duration-300 translate-y-4 opacity-0 pointer-events-auto ${bgClass}`;
      toast.innerHTML = `
        <span class="text-base shrink-0">${icon}</span>
        <span class="flex-1">${message}</span>
      `;

      container.appendChild(toast);

      // 애니메이션 노출
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      // 2.5초 후 자동 소멸
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 300);
      }, 2500);
    }

    // ----------------------------------------------------
    // 8. 실시간 시계 기능 (키오스크 환경 필수)
    // ----------------------------------------------------
    function startClock() {
      function updateClock() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dayStr = days[now.getDay()];

        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        const dateEl = document.getElementById('currentDate');
        const timeEl = document.getElementById('currentTime');
        if (dateEl) dateEl.textContent = `${y}-${m}-${d} (${dayStr})`;
        if (timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
      }
      updateClock();
      setInterval(updateClock, 1000);
    }

    // ----------------------------------------------------
    // DOM 로드 시 즉시 초기화
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
